<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cocktail Locker</title>
<meta name="description" content="Everyone's house cocktail specs, scaled for one glass or the whole party.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500..700;1,7..72,500..600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1 class="brand"><a href="./" id="home-link" title="Back to all drinks">The Cocktail <em>Locker</em></a></h1>
      <div class="tag">Everyone's house specs, scaled for one glass or the whole party.</div>
    </div>
    <div class="auth">
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Opening the bar…</span></div>
      <button class="locker-btn" id="locker-btn" type="button" hidden></button>
      <button class="btn small" id="auth-btn" type="button" hidden>Sign in or join</button>
    </div>
  </header>
  <form class="signin" id="signin" hidden>
    <label for="signin-email">Email</label>
    <input id="signin-email" type="email" autocomplete="email" required placeholder="you@example.com">
    <button class="btn primary small" type="submit">Email me a sign-in link</button>
    <button class="btn small ghost" type="button" id="signin-cancel">Cancel</button>
    <span class="hint" id="signin-msg" role="status"></span>
  </form>
  <form class="signin" id="name-form" hidden>
    <label for="locker-name">Name your locker</label>
    <input id="locker-name" type="text" maxlength="40" autocomplete="off" placeholder="Mitch's Bar">
    <button class="btn primary small" type="submit">Save</button>
    <button class="btn small ghost" type="button" id="name-cancel">Cancel</button>
    <span class="hint" id="name-msg" role="status">Everyone sees this name on your drinks.</span>
  </form>

  <div class="grid">
    <aside class="index" aria-label="Drink index">
      <section class="panel" aria-labelledby="find-title">
      <h2 class="panel-title" id="find-title">Find a drink</h2>
      <input class="search" id="search" type="search" placeholder="Search drinks, ingredients, brands" aria-label="Search drinks">
      <div class="sortrow"><label for="sort">Sort by</label><select id="sort"><option value="rated">Top rated</option><option value="az">A–Z</option><option value="new">Newest</option></select></div>
      <details class="filters" id="filters" open>
        <summary><span>Filters<span class="fcount" id="fcount" hidden></span></span></summary>
        <div class="fgrid">
          <label id="flt-owner-wrap">Locker<select id="flt-owner"></select></label>
          <label>Cocktail type<select id="flt-type"></select></label>
          <label>Base spirit<select id="flt-base"></select></label>
          <label>Method<select id="flt-method"></select></label>
          <label>Has ingredient<select id="flt-kind"></select></label>
          <label id="flt-rating-wrap">Rating<select id="flt-rating"></select></label>
        </div>
        <button class="fclear" id="fclear" type="button" hidden>Clear filters</button>
      </details>
      </section>
      <section class="panel" aria-labelledby="tools-title">
      <h2 class="panel-title" id="tools-title">Tools</h2>
      <div class="tools">
        <button class="tool" id="canmake-btn" type="button" hidden><b>What can I make?</b><span>Drinks your bar can make right now</span></button>
        <button class="tool" id="make-btn" type="button" hidden><b>Make me a drink</b><span>Claude invents 3 drinks from what you have</span></button>
        <button class="tool" id="party-btn" type="button"><b>Plan a party</b><span>Batches, shopping list and a menu</span></button>
        <button class="tool" id="scan-btn" type="button" hidden><b>Scan a recipe</b><span>Turn a photo into a drink</span></button>
      </div>
      <p class="hint" id="tools-hint" hidden>Sign in for your bar, AI ideas and recipe scanning.</p>
      </section>
      <section class="panel" aria-labelledby="drinks-title">
      <div class="index-head">
        <h2 class="panel-title" id="drinks-title">Drinks <span class="count" id="count-label"></span></h2>
        <div class="panel-actions">
          <button class="btn primary small" id="new-btn" type="button" hidden>+ New drink</button>
        </div>
      </div>
      <input type="file" id="scan-file" accept="image/*" hidden>
      <ul class="list" id="list"></ul>
      </section>
    </aside>

    <main class="card" id="main" aria-live="polite"></main>
  </div>
</div>
<div class="modal" id="share-modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="share-title">
    <div class="sheet-head"><h3 id="share-title">Share recipe</h3><button class="x" type="button" id="share-close" aria-label="Close">×</button></div>
    <div class="share-preview" id="share-preview">Making the recipe card…</div>
    <p class="hint" id="share-note" style="margin:0"></p>
    <div class="share-actions">
      <button class="btn primary" type="button" id="share-native" hidden>Share…</button>
      <button class="btn" type="button" id="share-copy">Copy image</button>
      <button class="btn" type="button" id="share-save">Save image</button>
      <button class="btn" type="button" id="share-link">Copy link</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-data.js"></script>
<script src="js/03-list.js"></script>
<script src="js/04-detail.js"></script>
<script src="js/05-share.js"></script>
<script src="js/06-scan.js"></script>
<script src="js/07-ratings.js"></script>
<script src="js/08-bartender.js"></script>
<script src="js/09-locker.js"></script>
<script src="js/10-standard.js"></script>
<script src="js/11-editor.js"></script>
<script src="js/13-match.js"></script>
<script src="js/99-start.js"></script>

</body>
</html>
