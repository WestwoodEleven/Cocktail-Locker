<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cocktail Locker</title>
<meta name="description" content="Everyone's house cocktail specs, scaled for one glass or the whole party.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500..700;1,7..72,500..600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a back-bar spec binder — drink index on the left, the open spec card on the right with its batch calculator */
:root {
  color-scheme: light;
  --bg: #E9EEEA;
  --surface: #F7F9F6;
  --raised: #FFFFFF;
  --ink: #18261F;
  --muted: #5B6B63;
  --rule: #C9D3CC;
  --accent: #9A5B0A;
  --accent-ink: #FFFFFF;
  --accent-soft: #F3E6CF;
  --green: #22513C;
  --green-soft: #D6E5DC;
  --danger: #A3302A;
  --focus: #2F6FB0;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1612; --surface: #15201B; --raised: #1B2822; --ink: #E5ECE7; --muted: #92A299;
    --rule: #2B3B34; --accent: #E3A643; --accent-ink: #1A1206; --accent-soft: #3A2C14;
    --green: #86C9A5; --green-soft: #1F3A2D; --danger: #EB7B70; --focus: #7FB2E8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1612; --surface: #15201B; --raised: #1B2822; --ink: #E5ECE7; --muted: #92A299;
  --rule: #2B3B34; --accent: #E3A643; --accent-ink: #1A1206; --accent-soft: #3A2C14;
  --green: #86C9A5; --green-soft: #1F3A2D; --danger: #EB7B70; --focus: #7FB2E8; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Masthead */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 34px); letter-spacing: -.01em; margin: 0; }
.brand a { color: inherit; text-decoration: none; border-radius: 6px; }
.brand a:hover em { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.brand em { font-style: italic; font-weight: 600; color: var(--accent); }
.tag { color: var(--muted); font-size: 13px; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.auth { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.signin { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; }
.signin label { font-size: 13px; font-weight: 600; }
.signin input { padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); min-width: 0; flex: 1 1 220px; }
.locker-btn { border: 0; background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
.locker-btn:hover { filter: brightness(.97); }
.filters { }
.filters summary { cursor: pointer; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; list-style: none; }
.filters summary::-webkit-details-marker { display: none; }
.filters summary::after { content: "▾"; color: var(--muted); font-size: 12px; }
.filters[open] summary::after { content: "▴"; }
.fcount { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: 11px; margin-left: 6px; }
.fgrid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
@media (max-width: 780px) { .fgrid { grid-template-columns: 1fr 1fr; } }
.fgrid label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.fgrid select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 7px; background: var(--raised); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); width: 100%; min-width: 0; }
.fclear { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; padding: 6px 0 0; }
.from { font-size: 14px; color: var(--muted); margin-top: 6px; }
.from button { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--green); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status.ok .dot { background: var(--green); }
.status.warn .dot { background: var(--accent); }

/* Grid */
.grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 780px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Index */
.index { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-title { font-family: var(--f-display); font-size: 20px; font-weight: 700; margin: 0; line-height: 1.2; }
.panel-title .count { font-family: var(--f-body); font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.index-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.search { width: 100%; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow-y: auto; }
@media (max-width: 780px) { .list { max-height: 240px; } }
.list button { width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.list .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.thumb { flex: none; width: 38px; height: 38px; border-radius: 7px; object-fit: cover; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.list button:hover { background: var(--green-soft); }
.list button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.list button[aria-current="true"] .sub { color: inherit; opacity: .7; }
.list .nm { font-family: var(--f-display); font-size: 17px; font-weight: 600; line-height: 1.25; }
.list .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-list { color: var(--muted); font-size: 13px; padding: 6px 4px; }

.btn { border: 1px solid var(--rule); background: var(--raised); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Spec card */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: clamp(18px, 3vw, 32px); display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 20px; align-items: start; }
.hero.no-photo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 560px) { .hero { grid-template-columns: minmax(0, 1fr); } .photo { order: -1; } }
.photo { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.photo img { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--r); background: var(--green-soft); display: block; }
@media (max-width: 560px) { .photo img { aspect-ratio: 4 / 3; max-height: 320px; } }
.photo .missing { aspect-ratio: 4 / 5; border-radius: var(--r); background: var(--green-soft); color: var(--muted); display: grid; place-items: center; font-size: 13px; padding: 12px; text-align: center; }
.photo-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.uploading { opacity: .55; }
.spec-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drink-name { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vw, 52px); line-height: 1.08; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green); }
.chip.amber { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--raised); border: 1px solid var(--danger); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

/* Batch controls */
.batch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; background: var(--raised); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; }
.ctl { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; width: fit-content; }
.stepper button { width: 40px; border: 0; background: var(--surface); cursor: pointer; font-size: 18px; font-weight: 600; }
.stepper button:hover { background: var(--green-soft); }
.stepper input { width: 72px; text-align: center; border: 0; border-inline: 1px solid var(--rule); font-family: var(--f-mono); font-size: 20px; font-weight: 600; padding: 6px 0; background: var(--raised); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 3px 10px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.presets button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.fill { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fill input { width: 88px; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); font-family: var(--f-mono); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); }

/* Ingredient table */
.spec-table { width: 100%; border-collapse: collapse; }
.spec-table td { padding: 11px 0; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
.spec-table tr:last-child td { border-bottom: 0; }
.spec-table .q { font-family: var(--f-mono); font-weight: 600; font-size: 19px; text-align: right; white-space: nowrap; padding-right: 8px; width: 1%; font-variant-numeric: tabular-nums; }
.spec-table .u { font-family: var(--f-mono); color: var(--muted); font-size: 13px; white-space: nowrap; padding-right: 18px; width: 1%; }
.spec-table .n { font-size: 16px; font-weight: 500; }
.spec-table .note { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.spec-table tr.water .n, .spec-table tr.water .q { color: var(--green); }
.totals { display: flex; flex-wrap: wrap; gap: 8px 24px; border-top: 2px solid var(--ink); padding-top: 12px; }
.tot { display: flex; flex-direction: column; }
.tot b { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.tot span { font-size: 12px; color: var(--muted); }
.notes { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; color: var(--ink); max-width: 65ch; white-space: pre-wrap; margin: 0; }
.notes-label { margin-bottom: 6px; }

/* Form */
.form { display: flex; flex-direction: column; gap: 18px; }
.form h2 { font-family: var(--f-display); font-weight: 700; font-size: 30px; margin: 0; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, .ing-row input, .ing-row select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); width: 100%; min-width: 0; }
.field textarea { min-height: 80px; resize: vertical; }
.ing-head, .ing-row { display: grid; grid-template-columns: 76px 104px minmax(0, 1.2fr) minmax(0, 1fr) 128px 60px 32px; gap: 8px; align-items: center; }
.ing-row .flt { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.ing-row .flt input { width: auto; accent-color: var(--accent); margin: 0; }
.float-tag { font-size: 11px; padding: 1px 7px; margin-left: 4px; vertical-align: 2px; }
.ing-head { font-size: 12px; font-weight: 600; color: var(--muted); }
.brand-note b { font-weight: 600; color: var(--ink); }
.ing-row input.amt { font-family: var(--f-mono); text-align: right; }
.ing-row .x { border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--muted); border-radius: 6px; height: 36px; }
.ing-row .x:hover { color: var(--danger); background: var(--surface); }
@media (max-width: 480px) {
  .ing-head { display: none; }
  .ing-row { grid-template-columns: 72px 1fr 64px 36px; }
  .ing-row .amt { grid-column: 1; grid-row: 1; }
  .ing-row select.ing-unit { grid-column: 2; grid-row: 1; }
  .ing-row .flt { grid-column: 3; grid-row: 1; }
  .ing-row .x { grid-column: 4; grid-row: 1; }
  .ing-row .ing-name { grid-column: 1 / 5; grid-row: 2; }
  .ing-row .ing-brand { grid-column: 1 / 5; grid-row: 3; }
  .ing-row .ing-kind { grid-column: 1 / 5; grid-row: 4; }
  .ing-row { padding-bottom: 10px; border-bottom: 1px dashed var(--rule); }
}
.ings { display: flex; flex-direction: column; gap: 8px; }
.err { color: var(--danger); font-size: 13px; font-weight: 600; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.blank { text-align: center; padding: 48px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.blank .glass { font-family: var(--f-display); font-weight: 600; font-size: 28px; color: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 20; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
@media (max-width: 600px) {
  body { font-size: 16px; line-height: 1.55; }
  input, select, textarea, .search, .fgrid select, .signin input, .fill input { font-size: 16px; }
  .tag, .status, .btn.small, .seg button, .locker-btn, .filters summary, .fclear, .empty-list, .ing-row .flt { font-size: 14px; }
  .label, .fgrid label, .field label, .tot span { font-size: 12.5px; }
  .list .nm { font-size: 18px; }
  .list .sub, .hint, .spec-table .note { font-size: 14px; }
  .spec-table .n { font-size: 17px; }
  .spec-table .u { font-size: 14px; }
  .presets button { font-size: 14px; padding: 5px 12px; }
  .fgrid select { padding: 8px 10px; }
}
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10, 18, 14, .55); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h3 { margin: 0; font-family: var(--f-display); font-size: 22px; }
.sheet .x { border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 8px; }
.sheet .x:hover { background: var(--green-soft); color: var(--ink); }
.share-preview { width: 100%; border-radius: 10px; border: 1px solid var(--rule); background: var(--raised); min-height: 160px; display: grid; place-items: center; color: var(--muted); font-size: 14px; overflow: hidden; }
.share-preview img { display: block; width: 100%; height: auto; }
.share-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.share-actions .btn { padding: 11px 14px; font-size: 15px; }
.panel-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.index-head { flex-wrap: wrap; }
.scan-banner { background: var(--accent-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.scan-banner b { color: var(--accent); }
.scanning { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px 8px; text-align: center; }
.scanning img { max-width: min(280px, 100%); max-height: 320px; border-radius: var(--r); border: 1px solid var(--rule); object-fit: contain; background: var(--raised); }
.scanning .glass { font-family: var(--f-display); font-weight: 700; font-size: 24px; }
.dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "…"; } }
.editor-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1 class="brand"><a href="./" id="home-link" title="Back to all drinks">The Cocktail <em>Locker</em></a></h1>
      <div class="tag">Everyone's house specs, scaled for one glass or the whole party.</div>
    </div>
    <div class="auth">
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Opening the bar…</span></div>
      <button class="locker-btn" id="locker-btn" type="button" hidden></button>
      <button class="btn small" id="auth-btn" type="button" hidden>Sign in or join</button>
    </div>
  </header>
  <form class="signin" id="signin" hidden>
    <label for="signin-email">Email</label>
    <input id="signin-email" type="email" autocomplete="email" required placeholder="you@example.com">
    <button class="btn primary small" type="submit">Email me a sign-in link</button>
    <button class="btn small ghost" type="button" id="signin-cancel">Cancel</button>
    <span class="hint" id="signin-msg" role="status"></span>
  </form>
  <form class="signin" id="name-form" hidden>
    <label for="locker-name">Name your locker</label>
    <input id="locker-name" type="text" maxlength="40" autocomplete="off" placeholder="Mitch's Bar">
    <button class="btn primary small" type="submit">Save</button>
    <button class="btn small ghost" type="button" id="name-cancel">Cancel</button>
    <span class="hint" id="name-msg" role="status">Everyone sees this name on your drinks.</span>
  </form>

  <div class="grid">
    <aside class="index" aria-label="Drink index">
      <section class="panel" aria-labelledby="find-title">
      <h2 class="panel-title" id="find-title">Find a drink</h2>
      <input class="search" id="search" type="search" placeholder="Search drinks, ingredients, brands" aria-label="Search drinks">
      <details class="filters" id="filters" open>
        <summary><span>Filters<span class="fcount" id="fcount" hidden></span></span></summary>
        <div class="fgrid">
          <label id="flt-owner-wrap">Locker<select id="flt-owner"></select></label>
          <label>Cocktail type<select id="flt-type"></select></label>
          <label>Base spirit<select id="flt-base"></select></label>
          <label>Method<select id="flt-method"></select></label>
          <label>Has ingredient<select id="flt-kind"></select></label>
        </div>
        <button class="fclear" id="fclear" type="button" hidden>Clear filters</button>
      </details>
      </section>
      <section class="panel" aria-labelledby="drinks-title">
      <div class="index-head">
        <h2 class="panel-title" id="drinks-title">Drinks <span class="count" id="count-label"></span></h2>
        <div class="panel-actions">
          <button class="btn small" id="scan-btn" type="button" hidden>Scan a recipe</button>
          <button class="btn primary small" id="new-btn" type="button" hidden>+ New drink</button>
        </div>
      </div>
      <input type="file" id="scan-file" accept="image/*" hidden>
      <ul class="list" id="list"></ul>
      </section>
    </aside>

    <main class="card" id="main" aria-live="polite"></main>
  </div>
</div>
<div class="modal" id="share-modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="share-title">
    <div class="sheet-head"><h3 id="share-title">Share recipe</h3><button class="x" type="button" id="share-close" aria-label="Close">×</button></div>
    <div class="share-preview" id="share-preview">Making the recipe card…</div>
    <p class="hint" id="share-note" style="margin:0"></p>
    <div class="share-actions">
      <button class="btn primary" type="button" id="share-native" hidden>Share…</button>
      <button class="btn" type="button" id="share-copy">Copy image</button>
      <button class="btn" type="button" id="share-save">Save image</button>
      <button class="btn" type="button" id="share-link">Copy link</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
  // ---------- units ----------
  const ML = { oz: 29.5735, ml: 1, cl: 10, tsp: 4.93, tbsp: 14.79, barspoon: 5, dash: 0.92 };
  const UNIT_OPTS = [["oz","oz"],["ml","ml"],["cl","cl"],["barspoon","barspoon"],["tsp","tsp"],["tbsp","tbsp"],["dash","dash"],["each","each / whole"]];
  const SPOONS = new Set(["barspoon","tsp","tbsp"]);
  const DILUTION = { Stirred: 0.20, Shaken: 0.25, Built: 0.10, Blended: 0, Thrown: 0.15 };
  const METHODS = ["Stirred","Shaken","Built","Blended","Thrown"];
  const PRESETS = [1, 2, 4, 8, 12, 24, 50];

  const FR8 = { 0: "", 1: "⅛", 2: "¼", 3: "⅜", 4: "½", 5: "⅝", 6: "¾", 7: "⅞" };
  function fracFmt(v, denom) {
    const q = Math.round(v * denom) / denom;
    if (q === 0) return v > 0 ? (Math.round(v * 100) / 100).toString() : "0";
    const whole = Math.floor(q + 1e-9);
    const eighths = Math.round((q - whole) * 8);
    return (whole ? String(whole) : "") + FR8[eighths] || "0";
  }
  const fmtOz = v => v < 2 ? fracFmt(v, 8) : v < 32 ? fracFmt(v, 4) : String(Math.round(v * 2) / 2).replace(/\.5$/, "½");
  const fmtMl = v => v < 10 ? String(Math.round(v * 2) / 2) : v < 100 ? String(Math.round(v)) : String(Math.round(v / 5) * 5);
  const fmtCl = v => String(Math.round(v * 10) / 10);
  const fmtCount = v => fracFmt(v, 2);
  const fmtLiters = ml => ml >= 1000 ? (Math.round(ml / 10) / 100) + " L" : fmtMl(ml) + " ml";

  function parseAmount(s) {
    s = String(s || "").trim().replace(/½/g," 1/2").replace(/¼/g," 1/4").replace(/¾/g," 3/4").replace(/⅛/g," 1/8").trim();
    if (!s) return NaN;
    let total = 0;
    for (const part of s.split(/\s+/)) {
      if (/^\d+\/\d+$/.test(part)) { const [a,b] = part.split("/").map(Number); if (!b) return NaN; total += a / b; }
      else if (/^\d*\.?\d+$/.test(part)) total += Number(part);
      else return NaN;
    }
    return total;
  }
  function amountToText(v) {
    if (!isFinite(v)) return "";
    const whole = Math.floor(v), rest = v - whole;
    const map = { 0.125: "1/8", 0.25: "1/4", 0.375: "3/8", 0.5: "1/2", 0.625: "5/8", 0.75: "3/4", 0.875: "7/8" };
    const key = Object.keys(map).find(k => Math.abs(rest - k) < 1e-6);
    if (rest === 0) return String(whole);
    if (key) return (whole ? whole + " " : "") + map[key];
    return String(Math.round(v * 1000) / 1000);
  }

  // Show one scaled ingredient in the chosen display mode
  function show(ing, mult, mode) {
    const amt = (Number(ing.amount) || 0) * mult;
    const unit = ing.unit;
    if (unit === "each") return { q: fmtCount(amt), u: "", note: "" };
    if (unit === "dash") {
      const n = Math.max(1, Math.round(amt));
      let note = "";
      if (n >= 12) { const ml = n * ML.dash; note = "≈ " + (mode === "ml" ? fmtMl(ml) + " ml" : fmtOz(ml / ML.oz) + " oz") + " if measuring"; }
      return { q: String(n), u: n === 1 ? "dash" : "dashes", note };
    }
    const ml = amt * (ML[unit] || 0);
    let out;
    const keepSpoon = SPOONS.has(unit) && ml < (mode === "ml" ? 15 : 30);
    if (keepSpoon) out = { q: fracFmt(amt, 4), u: unit === "barspoon" ? (amt > 1 ? "barspoons" : "barspoon") : unit };
    else if (mode === "ml" || (mode === "spec" && unit === "ml")) out = { q: fmtMl(ml), u: "ml" };
    else if (mode === "spec" && unit === "cl") out = { q: fmtCl(ml / 10), u: "cl" };
    else out = { q: fmtOz(ml / ML.oz), u: "oz" };
    out.note = ml >= 500 ? "≈ " + (Math.round(ml / 750 * 10) / 10) + " × 750 ml bottles" : "";
    return out;
  }
  const ingMl = i => i.unit === "each" ? 0 : (Number(i.amount) || 0) * (ML[i.unit] || 0);
  const liquidMl = (d, floats = false) => (d.ingredients || []).filter(i => !!i.float === floats).reduce((s, i) => s + ingMl(i), 0);

  // ---------- types ----------
  const TYPES = ["Sour", "Spirit-forward", "Highball", "Tiki", "Fizz & Collins", "Spritz & bubbly", "Flip & creamy", "Punch", "Hot", "Shot", "Other"];
  const BASES = ["Gin", "Vodka", "Rum", "Tequila", "Mezcal", "Whiskey", "Brandy", "Liqueur", "Wine & fortified", "No alcohol", "Other"];
  const KINDS = ["Spirit", "Liqueur", "Vermouth & wine", "Bitters", "Juice", "Syrup & sweetener", "Soda & mixer", "Egg & dairy", "Other"];
  const KIND_RULES = [
    ["Bitters", /bitters/],
    ["Liqueur", /liqueur|cointreau|triple sec|curac|campari|aperol|chartreuse|amaro|maraschino|kahl|creme de|crème de|st[- .]?germain|elderflower|benedictine|galliano|chambord|amaretto|fernet|cynar|schnapps|falernum|allspice dram|drambuie|frangelico|limoncello|grand marnier|midori|disaronno|baileys|irish cream|pimm/],
    ["Vermouth & wine", /vermouth|lillet|cocchi|sherry|\bport\b|wine|prosecco|champagne|cava|sparkling|madeira|sake/],
    ["Syrup & sweetener", /syrup|sugar|honey|agave|grenadine|orgeat|cream of coconut|coco l[oó]pez|maple|demerara/],
    ["Juice", /juice|\blime\b|\blemon\b|grapefruit|pineapple|passion ?fruit|cranberry|pur[eé]e/],
    ["Soda & mixer", /soda|tonic|ginger beer|ginger ale|cola|club|seltzer|sparkling water|lemonade|\bwater\b|\bcoffee\b|espresso|\btea\b/],
    ["Egg & dairy", /\begg|cream|milk|half and half|aquafaba/],
    ["Spirit", /\bgin\b|vodka|\brum\b|rhum|tequila|mezcal|whiske?y|bourbon|\brye\b|scotch|brandy|cognac|pisco|cacha[cç]a|calvados|armagnac|absinthe|aquavit|akvavit|genever|batavia|arrack|sotol|baijiu|soju|overproof/]
  ];
  const guessKind = name => { const n = String(name || "").toLowerCase(); for (const [k, re] of KIND_RULES) if (re.test(n)) return k; return "Other"; };
  const kindOf = i => i.kind || guessKind(i.name);
  const BASE_RULES = [["Mezcal", /mezcal|sotol/], ["Tequila", /tequila/], ["Rum", /\brum\b|rhum|cacha[cç]a|arrack/], ["Whiskey", /whiske?y|bourbon|\brye\b|scotch/],
    ["Brandy", /brandy|cognac|pisco|calvados|armagnac/], ["Gin", /\bgin\b|genever/], ["Vodka", /vodka/]];
  function guessBase(d) {
    const ings = (d.ingredients || []).filter(i => !i.float);
    const spirits = ings.filter(i => kindOf(i) === "Spirit").sort((a, b) => ingMl(b) - ingMl(a));
    for (const i of spirits) { const n = (i.name + " " + (i.brand || "")).toLowerCase(); for (const [b, re] of BASE_RULES) if (re.test(n)) return b; }
    if (spirits.length) return "Other";
    if (ings.some(i => kindOf(i) === "Liqueur")) return "Liqueur";
    if (ings.some(i => kindOf(i) === "Vermouth & wine")) return "Wine & fortified";
    return ings.length ? "No alcohol" : "Other";
  }
  const baseOf = d => d.base || guessBase(d);
  function guessType(d) {
    const ings = d.ingredients || [];
    const names = ings.map(i => (i.name + " " + (i.brand || "")).toLowerCase()).join(" | ");
    const kinds = new Set(ings.map(kindOf));
    const citrus = /\blime\b|\blemon\b|grapefruit|yuzu/.test(names) && kinds.has("Juice");
    const sweet = kinds.has("Syrup & sweetener") || kinds.has("Liqueur");
    if (/\bhot\b|toddy|mulled|irish coffee/.test(names) || /hot/i.test(d.glass || "")) return "Hot";
    if (baseOf(d) === "Rum" && /pineapple|orgeat|falernum|passion|coconut|allspice/.test(names)) return "Tiki";
    if (/prosecco|champagne|cava|sparkling wine/.test(names)) return "Spritz & bubbly";
    if (kinds.has("Soda & mixer") && !/\bwater\b|espresso|coffee/.test(names.replace(/sparkling water/g, "soda"))) return citrus && sweet && /soda|club|seltzer|sparkling water/.test(names) ? "Fizz & Collins" : "Highball";
    if (kinds.has("Egg & dairy") && !citrus) return "Flip & creamy";
    if (citrus) return "Sour";
    if (d.method === "Stirred" || d.method === "Built") return "Spirit-forward";
    return "Other";
  }
  const typeOf = d => d.type || guessType(d);

  // ---------- state ----------
  const S = {
    drinks: [], selected: null, servings: 1, mode: "spec", prebatch: false,
    view: "detail", editing: null, confirmDelete: false, query: "", loaded: false,
    canWrite: false, backend: null, session: null, uploading: null, confirmPhoto: false,
    profiles: {}, f: { owner: "", type: "", base: "", method: "", kind: "" }
  };
  try { const m = localStorage.getItem("mc-mode"); if (m) S.mode = m; } catch (e) {}

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, Math.max(2200, String(msg).length * 55)); }
  function setStatus(kind, text) { $("status").className = "status " + kind; $("status-text").textContent = text; }

  // ---------- storage ----------
  const LOCAL_KEY = "mc-drinks-local";
  const LOCAL_STARTERS = [
    { id: "negroni", name: "Negroni", glass: "Rocks", method: "Stirred", garnish: "Orange peel", starter: true,
      ingredients: [{amount:1,unit:"oz",name:"Gin"},{amount:1,unit:"oz",name:"Campari"},{amount:1,unit:"oz",name:"Sweet vermouth"}], notes: "" },
    { id: "daiquiri", name: "Daiquiri", glass: "Coupe", method: "Shaken", garnish: "Lime wheel", starter: true,
      ingredients: [{amount:2,unit:"oz",name:"White rum"},{amount:1,unit:"oz",name:"Fresh lime juice"},{amount:0.75,unit:"oz",name:"Simple syrup (1:1)"}], notes: "" }
  ];
  function localLoad() {
    try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return LOCAL_STARTERS.slice();
  }
  function localSave() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(S.drinks)); } catch (e) {} }

  const CFG = window.MC_CONFIG || {};
  const sb = CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
  const BUCKET = "photos";
  const photoUrl = p => sb && p ? sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl : "";

  const uid = () => S.session && S.session.user ? S.session.user.id : null;
  const isMine = d => S.backend === "local" || (!!uid() && d.owner === uid());
  const lockerName = id => !id ? "Unclaimed" : (S.profiles[id] && S.profiles[id].display_name) || "Unnamed locker";
  const myProfile = () => uid() ? S.profiles[uid()] : null;

  function refreshAuthUI() {
    if (S.backend !== "supabase") { $("auth-btn").hidden = true; $("locker-btn").hidden = true; $("new-btn").hidden = false; $("scan-btn").hidden = true; S.canWrite = true; return; }
    S.canWrite = !!S.session;
    $("auth-btn").hidden = false;
    $("auth-btn").textContent = S.session ? "Sign out" : "Sign in or join";
    $("new-btn").hidden = !S.canWrite;
    $("scan-btn").hidden = !S.canWrite;
    const me = myProfile();
    $("locker-btn").hidden = !S.session;
    $("locker-btn").textContent = me && me.display_name ? me.display_name : "Name your locker";
    $("locker-btn").title = "Rename your locker";
    if (S.session) $("signin").hidden = true;
    setStatus(S.session ? "ok" : "", S.session ? "Signed in" : "Browsing");
  }

  async function loadProfiles() {
    const { data, error } = await sb.from("profiles").select("id, display_name");
    if (!error) { S.profiles = {}; data.forEach(p => S.profiles[p.id] = p); }
    refreshAuthUI();
    if (S.session && S.loaded && !(myProfile() && myProfile().display_name)) openNameForm(true);
  }

  async function loadDrinks() {
    const { data, error } = await sb.from("drinks").select("id, owner, data");
    if (error) { setStatus("warn", "Couldn't load drinks. Refresh to try again."); S.loaded = true; afterData(); return; }
    S.drinks = data.map(r => Object.assign({}, r.data, { id: r.id, owner: r.owner }));
    S.loaded = true; afterData();
  }

  async function startStorage() {
    if (!sb) {
      S.backend = "local"; S.drinks = localLoad(); S.loaded = true;
      refreshAuthUI();
      setStatus("warn", "No database connected. Saving in this browser only.");
      afterData(); return;
    }
    S.backend = "supabase";
    try { const { data } = await sb.auth.getSession(); S.session = data.session; } catch (e) {}
    refreshAuthUI();
    sb.auth.onAuthStateChange((_ev, session) => {
      const changed = uid() !== (session && session.user ? session.user.id : null);
      S.session = session; refreshAuthUI();
      if (changed) {
        if (S.view === "edit") { S.view = "detail"; S.editing = null; }
        if (!session) { $("name-form").hidden = true; if (S.f.owner === "mine") S.f.owner = ""; }
        loadProfiles(); renderFilters(); renderList(); renderMain();
      }
    });
    await Promise.all([loadProfiles(), loadDrinks()]);
    renderFilters(); renderList(); if (S.view === "detail") renderMain();
    if (S.session && !(myProfile() && myProfile().display_name)) openNameForm(true);
    try {
      sb.channel("drinks-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "drinks" }, () => loadDrinks())
        .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => loadProfiles().then(() => { renderFilters(); renderList(); renderMain(); }))
        .subscribe();
    } catch (e) {}
  }

  function upsertMem(d) { const i = S.drinks.findIndex(x => x.id === d.id); if (i >= 0) S.drinks[i] = d; else S.drinks.push(d); }
  async function saveDrink(d) {
    if (S.backend === "supabase") {
      if (!uid()) { toast("Sign in to save changes."); return false; }
      const body = JSON.parse(JSON.stringify(d)); delete body.id; delete body.owner;
      const owner = d.owner || uid();
      const { error } = await sb.from("drinks").upsert({ id: d.id, owner, name: d.name, data: body, updated_at: new Date().toISOString() });
      if (error) { toast(owner !== uid() ? "You can only change drinks in your own locker." : "Couldn't save. Try again."); return false; }
      upsertMem(Object.assign({}, d, { owner })); return true;
    }
    upsertMem(d); localSave(); return true;
  }
  async function removeDrink(id) {
    if (S.backend === "supabase") {
      const { error } = await sb.from("drinks").delete().eq("id", id);
      if (error) { toast("Couldn't delete. Try again."); return false; }
    }
    S.drinks = S.drinks.filter(x => x.id !== id);
    if (S.backend === "local") localSave();
    return true;
  }

  $("auth-btn").onclick = async () => {
    if (S.session) { await sb.auth.signOut(); toast("Signed out"); return; }
    $("signin").hidden = false; $("signin-msg").textContent = "New here? The link creates your locker."; $("signin-email").focus();
  };
  $("signin-cancel").onclick = () => { $("signin").hidden = true; };
  $("signin").onsubmit = async ev => {
    ev.preventDefault();
    const email = $("signin-email").value.trim(); if (!email) return;
    $("signin-msg").textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
    $("signin-msg").textContent = !error ? "Check your email and tap the link to sign in."
      : /rate|seconds|too many/i.test(error.message || "") ? "Too many sign-in emails just now. Wait a few minutes and try again."
      : /signup|not allowed/i.test(error.message || "") ? "New sign-ups are turned off for this site."
      : "Couldn't send the link. Check the address and try again.";
  };

  function openNameForm(first) {
    const me = myProfile();
    $("name-form").hidden = false;
    $("locker-name").value = me && me.display_name ? me.display_name : "";
    $("name-msg").textContent = first ? "Welcome. Pick a name for your locker; everyone sees it on your drinks." : "Everyone sees this name on your drinks.";
    $("name-cancel").hidden = !!first && !(me && me.display_name);
    $("locker-name").focus();
  }
  $("locker-btn").onclick = () => openNameForm(false);
  $("name-cancel").onclick = () => { $("name-form").hidden = true; };
  $("name-form").onsubmit = async ev => {
    ev.preventDefault();
    const name = $("locker-name").value.trim().slice(0, 40);
    if (!name) { $("name-msg").textContent = "Enter a name, like Mitch's Bar."; return; }
    $("name-msg").textContent = "Saving…";
    const { error } = await sb.from("profiles").upsert({ id: uid(), display_name: name });
    if (error) { $("name-msg").textContent = "Couldn't save the name. Try again."; return; }
    S.profiles[uid()] = { id: uid(), display_name: name };
    $("name-form").hidden = true; refreshAuthUI(); renderFilters(); renderList(); renderMain();
    toast("Locker named " + name);
  };

  function sorted() { return S.drinks.slice().sort((a, b) => (a.name || "").localeCompare(b.name || "")); }
  function current() { return S.drinks.find(d => d.id === S.selected) || null; }
  function afterData() {
    const want = hashId();
    if (want && !S._hashDone && S.drinks.some(d => d.id === want)) { S.selected = want; S._hashDone = true; S.f = { owner: "", type: "", base: "", method: "", kind: "" }; }
    if (!current() && S.view === "detail") { const s = filtered(); S.selected = s[0] ? s[0].id : (sorted()[0] || {}).id || null; }
    renderFilters(); renderList(); if (S.view === "detail") renderMain();
  }

  // ---------- list + filters ----------
  const haystack = d => [d.name, d.glass, d.garnish, d.notes, d.method, typeOf(d), baseOf(d), S.backend === "supabase" ? lockerName(d.owner) : "",
    ...(d.ingredients || []).flatMap(i => [i.name, i.brand, kindOf(i)])].filter(Boolean).join(" ").toLowerCase();
  function passesFilters(d, skip) {
    const f = S.f;
    if (skip !== "owner" && f.owner && !(f.owner === "mine" ? isMine(d) : d.owner === f.owner)) return false;
    if (skip !== "type" && f.type && typeOf(d) !== f.type) return false;
    if (skip !== "base" && f.base && baseOf(d) !== f.base) return false;
    if (skip !== "method" && f.method && d.method !== f.method) return false;
    if (skip !== "kind" && f.kind && !(d.ingredients || []).some(i => kindOf(i) === f.kind)) return false;
    if (S.query.trim()) { const h = haystack(d); if (!S.query.toLowerCase().split(/\s+/).filter(Boolean).every(w => h.includes(w))) return false; }
    return true;
  }
  function filtered() { return sorted().filter(d => passesFilters(d)); }
  function renderFilters() {
    const multi = S.backend === "supabase";
    $("flt-owner-wrap").hidden = !multi;
    const opts = (key, all, label, valueOf) => {
      const counts = {};
      S.drinks.filter(d => passesFilters(d, key)).forEach(d => [].concat(valueOf(d)).forEach(v => counts[v] = (counts[v] || 0) + 1));
      const sel = S.f[key];
      const list = all.filter(v => counts[v] || v === sel);
      return `<option value="">${label}</option>` + list.map(v => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(v)} (${counts[v] || 0})</option>`).join("");
    };
    if (multi) {
      const ids = [...new Set(S.drinks.map(d => d.owner || ""))];
      const counts = {}; S.drinks.filter(d => passesFilters(d, "owner")).forEach(d => counts[d.owner || ""] = (counts[d.owner || ""] || 0) + 1);
      const named = ids.filter(id => id !== uid()).sort((a, b) => lockerName(a).localeCompare(lockerName(b)));
      $("flt-owner").innerHTML = `<option value="">Everyone's lockers</option>` +
        (uid() ? `<option value="mine" ${S.f.owner === "mine" ? "selected" : ""}>My locker (${S.drinks.filter(d => passesFilters(d, "owner") && isMine(d)).length})</option>` : "") +
        named.filter(id => id).map(id => `<option value="${esc(id)}" ${S.f.owner === id ? "selected" : ""}>${esc(lockerName(id))} (${counts[id] || 0})</option>`).join("");
    }
    $("flt-type").innerHTML = opts("type", TYPES, "Any type", typeOf);
    $("flt-base").innerHTML = opts("base", BASES, "Any base", baseOf);
    $("flt-method").innerHTML = opts("method", METHODS, "Any method", d => d.method || "");
    $("flt-kind").innerHTML = opts("kind", KINDS, "Anything", d => [...new Set((d.ingredients || []).map(kindOf))]);
    const n = Object.values(S.f).filter(Boolean).length;
    $("fcount").hidden = !n; $("fcount").textContent = n;
    $("fclear").hidden = !n;
  }

          const lw = ctx.measureText(lines[lines.length - 1]).width;
          ctx.font = `700 22px ${body}`;
          if (draw) { ctx.fillStyle = CARD.soft; roundRect(ctx, nX + lw + 14, yy - 30, 96, 38, 19); ctx.fill(); ctx.fillStyle = CARD.accent; ctx.fillText("FLOAT", nX + lw + 30, yy - 3); }
        }
        const notes = [];
        if (row.i && row.i.brand) notes.push("Recommended: " + row.i.brand);
        if (row.float && many) notes.push(`${row.g.q}${row.g.u ? " " + row.g.u : ""} on top of each glass`);
        if (row.water) notes.push(`Stands in for ${Math.round(dil * 100)}% dilution. Chill and pour.`);
        if (row.s.note) notes.push(row.s.note);
        ctx.font = `400 28px ${body}`;
        notes.forEach(n => wrap(ctx, n, nW).forEach(ln => { yy += 40; if (draw) { ctx.fillStyle = CARD.muted; ctx.fillText(ln, nX, yy); } }));
        y = yy + 26;
        if (draw && k < rows.length - 1) { ctx.fillStyle = CARD.rule; ctx.fillRect(P, y, inner, 2); }
        y += 2;
      });
      if (draw) { ctx.fillStyle = CARD.ink; ctx.fillRect(P, y + 8, inner, 4); }
      y += 12;
      if (d.garnish) { ctx.font = `600 30px ${body}`; y += 56; if (draw) { ctx.fillStyle = CARD.ink; ctx.fillText("Garnish: " + d.garnish, P, y); } }
      if (d.notes) {
        ctx.font = `400 30px ${body}`;
        let lines = d.notes.split(/\n+/).flatMap(par => wrap(ctx, par, inner - 24));
        if (lines.length > 8) { lines = lines.slice(0, 8); lines[7] += " …"; }
        y += 30;
        const top = y;
        lines.forEach(ln => { y += 44; if (draw) { ctx.fillStyle = CARD.ink; ctx.fillText(ln, P + 24, y); } });
        if (draw) { ctx.fillStyle = CARD.accent; ctx.fillRect(P, top + 10, 5, y - top + 4); }
      }
      y += 70;
      ctx.font = `500 24px ${body}`;
      if (draw) { ctx.fillStyle = CARD.muted; ctx.fillText((location.host + location.pathname).replace(/\/$/, ""), P, y); }
      return y + 52;
    };
    const c = document.createElement("canvas"); c.width = W; c.height = 10;
    const H = Math.ceil(layout(c.getContext("2d"), false));
    c.height = H;
    layout(c.getContext("2d"), true);
    const blob = await new Promise((res, rej) => { try { c.toBlob(b => b ? res(b) : rej(new Error("empty")), "image/png"); } catch (e) { rej(e); } });
    return blob;
  }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  let shareState = null;
  async function openShare(d) {
    const modal = $("share-modal");
    modal.hidden = false; $("share-preview").textContent = "Making the recipe card…";
    const unitsLabel = { spec: "as written", oz: "in oz", ml: "in ml" }[S.mode];
    $("share-note").textContent = (S.servings === 1 ? "One drink" : `Batch for ${fmtCount(S.servings)} drinks`) + ", " + unitsLabel + ". Change the amounts on the recipe first to share a different batch.";
    ["share-native", "share-copy", "share-save"].forEach(id => $(id).disabled = true);
    $("share-close").focus();
    let blob;
    try { blob = await buildCard(d, true); } catch (e) { try { blob = await buildCard(d, false); } catch (e2) { blob = null; } }
    if (modal.hidden) return;
    if (!blob) { $("share-preview").textContent = "Couldn't make the image. You can still copy the link."; return; }
    const slug = (d.name || "drink").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "drink";
    const file = new File([blob], slug + ".png", { type: "image/png" });
    const url = URL.createObjectURL(blob);
    if (shareState && shareState.url) URL.revokeObjectURL(shareState.url);
    shareState = { d, blob, file, url };
    $("share-preview").innerHTML = `<img src="${url}" alt="Recipe card for ${esc(d.name)}">`;
    const canShareFile = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    $("share-native").hidden = !canShareFile;
    $("share-copy").hidden = !(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write);
    ["share-native", "share-copy", "share-save"].forEach(id => $(id).disabled = false);
  }
  function closeShare() { $("share-modal").hidden = true; }
  $("share-close").onclick = closeShare;
  $("share-modal").addEventListener("click", e => { if (e.target === $("share-modal")) closeShare(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("share-modal").hidden) closeShare(); });
  $("share-native").onclick = async () => {
    const { d, file } = shareState;
    try { await navigator.share({ files: [file], title: d.name, text: `${d.name} from The Cocktail Locker\n${drinkLink(d.id)}` }); }
    catch (e) { if (e && e.name !== "AbortError") toast("Couldn't open sharing. Try Save image instead."); }
  };
  $("share-copy").onclick = async () => {
    try { await navigator.clipboard.write([new ClipboardItem({ "image/png": shareState.blob })]); toast("Image copied. Paste it into a text or email."); }
    catch (e) { toast("Couldn't copy the image here. Try Save image."); }
  };
  $("share-save").onclick = () => {
    const a = document.createElement("a"); a.href = shareState.url; a.download = shareState.file.name;
    document.body.appendChild(a); a.click(); a.remove(); toast("Image saved");
  };
  $("share-link").onclick = async () => {
    const d = shareState ? shareState.d : current(); const link = drinkLink(d.id);
    try { await navigator.clipboard.writeText(link); toast("Link copied"); }
    catch (e) { $("share-note").textContent = link; toast("Copy the link shown above"); }
  };

  // ---------- scan a recipe photo ----------
  const SCAN_ERR = {
    signed_out: "Your sign-in expired. Sign in again to scan recipes.",
    daily_limit: "You've hit today's limit for scanning recipes. Try again tomorrow.",
    no_recipe: "Couldn't find a cocktail recipe in that photo. Try a closer, sharper shot.",
    too_large: "That photo is too big. Try a smaller one.",
    bad_image: "That photo format isn't supported. Use a JPEG or PNG.",
    not_configured: "Recipe scanning isn't switched on yet. The site owner needs to add the Claude API key.",
    bad_key: "Anthropic rejected the Claude API key. Check that the full key was pasted into the ANTHROPIC_API_KEY secret.",
    key_not_allowed: "The Claude API key doesn't have permission to do this. Create a new key in the Anthropic Console.",
    no_credit: "The Anthropic account is out of credit. Add credit under Billing in the Anthropic Console.",
    bad_model: "The Claude model name isn't recognized. Remove or fix the RECIPE_MODEL secret in Supabase.",
    busy: "Claude is busy right now. Try again in a minute.",
    not_deployed: "Recipe scanning isn't set up yet: Supabase has no function named read-recipe.",
    unreachable: "Couldn't reach the recipe scanner. In Supabase, check that read-recipe has Verify JWT turned off, then try again.",
    crashed: "The recipe scanner hit an error. Check read-recipe's Logs in Supabase."
  };
  async function shrinkForScan(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  }
  function recipeToDrink(r) {
    const okUnit = u => ["oz", "ml", "cl", "barspoon", "tsp", "tbsp", "dash", "each"].includes(u) ? u : "oz";
    const ings = (r.ingredients || []).filter(i => i && String(i.name || "").trim()).map(i => {
      const out = { amount: Number(i.amount) > 0 ? Math.round(Number(i.amount) * 1000) / 1000 : "", unit: okUnit(i.unit), name: String(i.name).trim().slice(0, 80) };
      if (i.brand && String(i.brand).trim()) out.brand = String(i.brand).trim().slice(0, 80);
      if (i.float) out.float = true;
      return out;
    });
    return {
      id: null, name: String(r.name || "").trim().slice(0, 80),
      glass: String(r.glass || "").trim().slice(0, 40), garnish: String(r.garnish || "").trim().slice(0, 80),
      method: METHODS.includes(r.method) ? r.method : "Shaken",
      type: TYPES.includes(r.type) ? r.type : "", base: BASES.includes(r.base) ? r.base : "",
      notes: String(r.notes || "").trim().slice(0, 1500),
      ingredients: ings.length ? ings : [{ amount: "", unit: "oz", name: "" }]
    };
  }
  async function scanRecipe(file) {
    if (!sb || !S.session) { toast("Sign in to scan recipes."); return; }
    let dataUrl;
    try { dataUrl = await shrinkForScan(file); }
    catch (e) { toast("Couldn't open that photo. Try a JPEG or PNG."); return; }
    const token = {};
    S.scan = { preview: dataUrl, token }; S.view = "scan"; S.scanNote = null;
    renderList(); renderMain(); $("main").scrollIntoView({ behavior: "smooth", block: "start" });
    let code = "", recipe = null;
    try {
      const { data, error } = await sb.functions.invoke("read-recipe", { body: { image: dataUrl.split(",")[1], mediaType: "image/jpeg" } });
      if (error) {
        const resp = error.context;
        if (resp && typeof resp.json === "function") {
          if (resp.status === 404) code = "not_deployed";
          else { try { code = (await resp.json()).error || ""; } catch (e2) {} }
          if (!code && resp.status === 401) code = "signed_out";
          if (!code && resp.status >= 500) code = "crashed";
        } else code = error.name === "FunctionsFetchError" ? "unreachable" : "";
      } else recipe = data && data.recipe;
    } catch (e) { code = ""; }
    if (!S.scan || S.scan.token !== token) return;
    S.scan = null;
    if (!recipe) { S.view = "detail"; renderList(); renderMain(); toast(SCAN_ERR[code] || "Couldn't read that photo. Try again."); return; }
    openEditor(recipeToDrink(recipe), false, { warning: String(recipe.warning || "").trim() });
  }
  $("scan-btn").onclick = () => $("scan-file").click();
  $("scan-file").onchange = ev => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (f) scanRecipe(f); };

  // ---------- editor ----------
  const draftDrink = () => { const e = S.editing || {}; return { method: e.method, glass: e.glass,
    ingredients: (e.ingredients || []).filter(i => (i.name || "").trim()).map(i => ({ name: i.name, brand: i.brand, kind: i.kind || "", unit: i.unit, float: i.float, amount: parseAmount(i.amountText) || 0 })) }; };
  function openEditor(d, isCopy, scanNote) {
    S.view = "edit"; S.confirmDelete = false; S.isCopy = !!isCopy; S.scanNote = scanNote || null;
    S.editing = d ? JSON.parse(JSON.stringify(d)) : { id: null, name: "", glass: "", method: "Stirred", garnish: "", notes: "",
      ingredients: [{ amount: "", unit: "oz", name: "" }, { amount: "", unit: "oz", name: "" }, { amount: "", unit: "dash", name: "" }] };
    S.editing.ingredients = S.editing.ingredients.map(i => Object.assign({}, i, { amountText: typeof i.amount === "number" ? amountToText(i.amount) : (i.amount || "") }));
    S.editing.type = S.editing.type || ""; S.editing.base = S.editing.base || "";
    renderList(); renderEditor();
    $("main").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function readForm() {
    const e = S.editing;
    e.name = $("f-name").value; e.glass = $("f-glass").value; e.method = $("f-method").value;
    e.garnish = $("f-garnish").value; e.notes = $("f-notes").value;
    e.type = $("f-type").value; e.base = $("f-base").value;
    document.querySelectorAll(".ing-row").forEach((r, i) => {
      e.ingredients[i].amountText = r.querySelector(".amt").value;
      e.ingredients[i].unit = r.querySelector(".ing-unit").value;
      e.ingredients[i].kind = r.querySelector(".ing-kind").value;
      e.ingredients[i].name = r.querySelector(".ing-name").value;
      e.ingredients[i].brand = r.querySelector(".ing-brand").value;
      e.ingredients[i].float = r.querySelector(".flt input").checked;
    });
  }
  function renderEditor(errMsg) {
    const e = S.editing; const m = $("main");
    const ingRows = e.ingredients.map((i, k) => `
      <div class="ing-row">
        <input class="amt" id="ing-amt-${k}" type="text" inputmode="decimal" placeholder="Amount" value="${esc(i.amountText)}" aria-label="Amount">
        <select class="ing-unit" id="ing-unit-${k}" aria-label="Unit">${UNIT_OPTS.map(([v, l]) => `<option value="${v}" ${i.unit === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        <input class="ing-name" id="ing-name-${k}" type="text" placeholder="Ingredient" value="${esc(i.name)}" aria-label="Ingredient">
        <input class="ing-brand" id="ing-brand-${k}" type="text" placeholder="Recommended brand (optional)" value="${esc(i.brand || "")}" aria-label="Recommended brand (optional)">
        <select class="ing-kind" id="ing-kind-${k}" aria-label="Ingredient type"><option value="">${esc("Auto: " + guessKind(i.name))}</option>${KINDS.map(x => `<option ${i.kind === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
        <label class="flt" title="Pour on top of each glass at serving"><input type="checkbox" id="ing-float-${k}" ${i.float ? "checked" : ""}>Float</label>
        <button class="x" type="button" data-rm="${k}" aria-label="Remove ingredient">×</button>
      </div>`).join("");
    m.innerHTML = `
      <form class="form" id="form" novalidate>
        <div class="editor-top"><h2>${e.id ? "Edit " + esc(e.name || "drink") : S.isCopy ? "Copy to your locker" : "New drink"}</h2>
          ${!e.id && !S.isCopy && S.backend === "supabase" ? `<button class="btn small" type="button" id="fill-photo">Fill from a photo</button>` : ""}</div>
        ${S.scanNote ? `<div class="scan-banner"><span><b>Read from your photo.</b> Check the amounts and names before saving.</span>${S.scanNote.warning ? `<span>${esc(S.scanNote.warning)}</span>` : ""}</div>` : ""}
        <div class="field"><label for="f-name">Name</label><input id="f-name" type="text" value="${esc(e.name)}" placeholder="Drink name" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label for="f-glass">Glass</label><input id="f-glass" type="text" list="glasses" value="${esc(e.glass)}" placeholder="Glass"></div>
          <div class="field"><label for="f-method">Method</label><select id="f-method">${METHODS.map(x => `<option ${e.method === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
          <div class="field"><label for="f-garnish">Garnish</label><input id="f-garnish" type="text" value="${esc(e.garnish)}" placeholder="Garnish"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="f-type">Cocktail type</label><select id="f-type"><option value="" id="f-type-auto">${esc("Auto: " + guessType(draftDrink()))}</option>${TYPES.map(x => `<option ${e.type === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
          <div class="field"><label for="f-base">Base spirit</label><select id="f-base"><option value="" id="f-base-auto">${esc("Auto: " + guessBase(draftDrink()))}</option>${BASES.map(x => `<option ${e.base === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
        </div>
        <datalist id="glasses"><option>Rocks</option><option>Coupe</option><option>Nick &amp; Nora</option><option>Collins</option><option>Highball</option><option>Martini</option><option>Copper mug</option><option>Wine glass</option><option>Tiki mug</option><option>Flute</option></datalist>
        <div class="field">
          <span class="label">Ingredients · amounts for one drink</span>
          <div class="ings">
            <div class="ing-head"><span>Amount</span><span>Unit</span><span>Ingredient</span><span>Recommended brand</span><span>Type</span><span>On top</span><span></span></div>
            ${ingRows}
          </div>
          <div><button class="btn small" type="button" id="add-ing">+ Add ingredient</button> <span class="hint">Fractions like 3/4 or 1 1/2 work. Brand is optional. Type sorts the ingredient for filters; Auto guesses from the name. Tick Float for anything poured on top at the end.</span></div>
        </div>
        <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" placeholder="Notes">${esc(e.notes)}</textarea></div>
        ${errMsg ? `<div class="err" role="alert">${esc(errMsg)}</div>` : ""}
        <div class="form-actions"><button class="btn primary" type="submit" id="save-btn">${e.id ? "Save changes" : "Add to my locker"}</button><button class="btn" type="button" id="cancel-btn">Cancel</button></div>
      </form>`;
    const refreshAuto = () => {
      readForm();
      const dd = draftDrink();
      $("f-type-auto").textContent = "Auto: " + guessType(dd);
      $("f-base-auto").textContent = "Auto: " + guessBase(dd);
      document.querySelectorAll(".ing-row").forEach((r, k) => { r.querySelector(".ing-kind option[value='']").textContent = "Auto: " + guessKind(e.ingredients[k].name); });
    };
    m.querySelectorAll(".ing-name, .ing-brand, .amt").forEach(x => x.addEventListener("input", refreshAuto));
    m.querySelectorAll(".ing-unit, .ing-kind, #f-method, .flt input").forEach(x => x.addEventListener("change", refreshAuto));
    $("add-ing").onclick = () => { readForm(); e.ingredients.push({ amountText: "", unit: "oz", name: "" }); renderEditor(); $("ing-amt-" + (e.ingredients.length - 1)).focus(); };
    m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { readForm(); e.ingredients.splice(Number(b.dataset.rm), 1); if (!e.ingredients.length) e.ingredients.push({ amountText: "", unit: "oz", name: "" }); renderEditor(); });
    $("cancel-btn").onclick = () => { S.view = "detail"; S.editing = null; S.scanNote = null; renderList(); renderMain(); };
    if ($("fill-photo")) $("fill-photo").onclick = () => $("scan-file").click();
    $("form").onsubmit = async ev => {
      ev.preventDefault(); readForm();
      if (!e.name.trim()) return renderEditor("Give the drink a name.");
      const ings = [];
      for (const i of e.ingredients) {
        const nm = (i.name || "").trim(); const txt = (i.amountText || "").trim();
        if (!nm && !txt) continue;
        if (!nm) return renderEditor("One ingredient has an amount but no name.");
        const a = parseAmount(txt);
        if (!(a > 0)) return renderEditor(`Check the amount for ${nm}. Use numbers like 2, 0.75 or 1 1/2.`);
        const ing = { amount: a, unit: i.unit, name: nm };
        if (i.float) ing.float = true;
        if ((i.brand || "").trim()) ing.brand = i.brand.trim();
        if (i.kind) ing.kind = i.kind;
        ings.push(ing);
      }
      if (!ings.length) return renderEditor("Add at least one ingredient.");
      const isNew = !e.id;
      const id = e.id || (e.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "drink") + "-" + Math.random().toString(36).slice(2, 7);
      const d = { id, name: e.name.trim(), glass: e.glass.trim(), method: e.method, garnish: e.garnish.trim(), notes: e.notes.trim(), ingredients: ings, updatedAt: new Date().toISOString() };
      if (e.type) d.type = e.type;
      if (e.base) d.base = e.base;
      if (e.photo) d.photo = e.photo;
      if (e.owner) d.owner = e.owner;
      $("save-btn").disabled = true;
      const ok = await saveDrink(d);
      if (!ok) { $("save-btn").disabled = false; return; }
      S.selected = id; S.view = "detail"; S.scanNote = null; if (!passesFilters(S.drinks.find(x => x.id === id) || d)) { S.f = { owner: "", type: "", base: "", method: "", kind: "" }; S.query = ""; $("search").value = ""; } renderFilters(); S.editing = null; S.servings = 1; S._fillL = null;
      if (S.backend === "db" && !S.drinks.find(x => x.id === id)) S.drinks.push(d);
      renderList(); renderMain(); toast(isNew ? "Added " + d.name : "Saved " + d.name);
    };
  }

  renderList(); renderMain();
  startStorage();
})();
</script>
